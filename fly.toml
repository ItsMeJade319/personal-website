# fly.toml app configuration file
#
# Deploys this app as a separate Fly.io app from the existing
# evida-suntoyo-website app (which serves the evidasuntoyo.com apex domain).
# This app is intended to be reachable at agung.evidasuntoyo.com.
#
# See https://fly.io/docs/reference/configuration/ for details.

app = "agung-personal-website"
primary_region = "iad"
console_command = "/rails/bin/rails console"

[build]

[env]
  HTTP_PORT = "8080"
  SOLID_QUEUE_IN_PUMA = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "rails_storage"
  destination = "/rails/storage"
