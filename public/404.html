<!doctype html>

<html lang="en">

  <head>

    <title>Error 404 - Page not found</title>

    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,700;1,700&display=swap">
    <link rel="stylesheet" href="/vendor/98css-0.1.21/98.css">
    <link rel="stylesheet" href="/error-theme.css">

  </head>

  <body>

    <!-- This file lives in public/404.html -->

    <div class="window" role="alertdialog" aria-labelledby="error-title-bar">
      <div class="title-bar">
        <div class="title-bar-text" id="error-title-bar">Error - Explorer</div>
        <div class="title-bar-controls">
          <button aria-label="Close" disabled></button>
        </div>
      </div>
      <div class="window-body">
        <svg class="error-icon" width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="4" y="4" width="32" height="32" fill="#c2408f" stroke="#241c3e" stroke-width="2"/>
          <path d="M4 4 L20 20 L4 36 Z" fill="#ffffff"/>
          <path d="M36 4 L20 20 L36 36 Z" fill="#ffffff"/>
        </svg>
        <div class="error-heading">
          <p class="error-code">404</p>
          <p class="error-title">Page not found</p>
        </div>
        <p class="error-message">
          This computer cannot find <span class="error-path" id="error-path">C:\[requested&nbsp;path]</span>.
          It may have been moved, renamed or deleted. Check the address for typos, or head somewhere else.
        </p>
        <a class="btn98" href="/">Back to homepage</a>
      </div>
      <div class="status-bar">
        <p class="status-bar-field">Error 404 &middot; File not found</p>
      </div>
    </div>

    <script>
      (function () {
        var el = document.getElementById("error-path");
        if (el && window.location && window.location.pathname) {
          el.textContent = "C:\\" + window.location.pathname.replace(/^\//, "").split("/").join("\\");
        }
      })();
    </script>

  </body>

</html>
